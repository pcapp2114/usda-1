nass_release_textarea_page_bottom:
  value: "<p>The 2023 Agricultural Statistics Board calendar is now available for download in PDF format (<a href=\"https://www.nass.usda.gov/Publications/Calendar/2023/2023ReleaseCalendar_12Months_11x17_Color%20Final.pdf\">full calendar</a>) or (<a href=\"https://www.nass.usda.gov/Publications/Calendar/2023/2023ReleaseCalendar_6Months_85x11_Color.pdf\">printer-friendly</a>), as well as in the&nbsp;<a href=\"https://www.nass.usda.gov/Publications/Calendar/2023/NassReleases2023.ics\">iCalendar format</a>.</p>\r\n\r\n<p>You may also&nbsp;<a href=\"https://www.nass.usda.gov/Publications/Request_ASB_Calendars/index.php\">click here to order 2023 ASB pocket calendars</a>.</p>\r\n"
