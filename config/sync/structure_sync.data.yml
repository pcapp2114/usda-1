  -
    info: 'Official .gov Website '
    langcode: en
    uuid: e863b53b-2e48-4d82-a5a0-c92581fdd25a
    bundle: header
    revision_id: null
    rev_id_current: null
    fields:
      body:
        -
          value: "<div class=\"usa-accordion\">\r\n<header aria-label=\"Official United States Government Website Disclaimer\" class=\"usa-banner-header\">\r\n<div class=\"usa-grid usa-banner-inner\"><img alt=\"U.S. flag\" src=\"/themes/custom/nass/assets/img/flag-favicon-57.png\" />\r\n<p>An official website of the United States government</p>\r\n<button aria-controls=\"gov-banner\" aria-expanded=\"false\" class=\"usa-accordion-button usa-banner-button\"><span class=\"usa-banner-button-text\">Here's how you know</span></button></div>\r\n</header>\r\n\r\n<div aria-hidden=\"false\" class=\"usa-banner-content usa-grid usa-accordion-content\" id=\"gov-banner\">\r\n<div class=\"usa-banner-guidance-gov usa-width-one-half\"><img alt=\"Dot gov\" class=\"usa-banner-icon usa-media_block-img\" src=\"/themes/custom/nass/assets/img/icon-dot-gov.svg\" />\r\n<div class=\"usa-media_block-body\">\r\n<p><strong>Official websites use .gov </strong><br />\r\nA <strong>.gov</strong> website belongs to an official government organization in the United States.</p>\r\n</div>\r\n</div>\r\n\r\n<div class=\"usa-banner-guidance-ssl usa-width-one-half\"><img alt=\"SSL\" class=\"usa-banner-icon usa-media_block-img\" src=\"/themes/custom/nass/assets/img/icon-https.svg\" />\r\n<div class=\"usa-media_block-body\">\r\n<p><strong>Secure .gov websites use HTTPS</strong><br />\r\nA <strong>lock</strong> ( <span class=\"icon-lock\"><svg aria-labelledby=\"banner-lock-title banner-lock-description\" class=\"usa-banner__lock-image\" height=\"64\" role=\"img\" viewbox=\"0 0 52 64\" width=\"52\" xmlns=\"http://www.w3.org/2000/svg\">\r\n<title id=\"banner-lock-title\"></title>\r\n<desc id=\"banner-lock-description\">A locked padlock</desc><path d=\"M26 0c10.493 0 19 8.507 19 19v9h3a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V32a4 4 0 0 1 4-4h3v-9C7 8.507 15.507 0 26 0zm0 8c-5.979 0-10.843 4.77-10.996 10.712L15 19v9h22v-9c0-6.075-4.925-11-11-11z\" fill=\"#000000\" fill-rule=\"evenodd\"></path></svg></span> ) or <strong>https://</strong> means you've safely connected to the .gov website. Share sensitive information only on official, secure websites.</p>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n"
          summary: ''
          format: full_html
