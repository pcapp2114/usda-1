    fields:
      body:
        -
          value: "<h3>MEDIA CONTACTS</h3>\r\n\r\n<p>Kristen Lenhardt, Public Affairs Director<br />\r\n202.690.8122<br />\r\n<a href=\"mailto:kristen.lenhardt@usda.gov\">kristen.lenhardt@usda.gov</a></p>\r\n\r\n<p>Teresa White, Public Affairs Deputy Director<br />\r\n202.690.8122<br />\r\n<a href=\"mailto:teresa.white@usda.gov\">teresa.white@usda.gov</a></p>\r\n\r\n<p><a href=\"\">View All Media Contacts</a></p>\r\n"
          summary: ''
          format: full_html
  -
    info: 'About NASS'
    langcode: en
    uuid: acda34da-d5dd-4e76-b67f-027b906fc616
    bundle: menu_info
    revision_id: null
    rev_id_current: null
    fields:
      body:
        -
          value: "<h3>CUSTOMER SERVICE CONTACT</h3>\r\n\r\n<p><strong>Toll Free Data &amp; Tradeshow Inquiries</strong><br />\r\nMonday - Friday,7:30 AM -4:00 PM ET<br />\r\n(Except Federal Holidays)<br />\r\n800.272.9540</p>\r\n\r\n<p><strong>Other USDA Inquiries</strong><br />\r\nMonday - Friday,9:00 AM -5:30 PM ET<br />\r\n(Except Federal Holidays)</p>\r\n\r\n<p>833.one.USDA</p>\r\n\r\n<p><a href=\"mailto:askusda@usda.gov\">askusda@usda.gov</a></p>\r\n\r\n<p><a href=\"\">AskUSDA</a></p>\r\n"
          summary: ''
          format: full_html
  -
    info: 'Search For Data (Placeholder)'
