    rev_id_current: null
    fields:
      body:
        -
          value: "<form><select id=\"data-type\" name=\"dataType\"><option value=\"\">Select Data Type</option><option value=\"releases\">Releases</option><option value=\"census\">Census</option><option value=\"statistics\">Statistics</option></select> <select id=\"topic\" name=\"topic\"><option value=\"\">Select Topic</option><option value=\"va\">A</option><option value=\"b\">B</option><option value=\"c\">C</option> </select> <select id=\"year\" name=\"year\"><option value=\"\">Select Year</option><option value=\"2022\">2022</option><option value=\"2021\">2021</option><option value=\"2020\">2020</option> </select> <input type=\"submit\" value=\"Search Data\" />&nbsp;</form>\r\n"
          summary: ''
