          value: "<h3>CUSTOMER SERVICE CONTACT</h3>\r\n\r\n<p><strong>Toll Free Data &amp; Tradeshow Inquiries</strong><br />\r\nMonday - Friday,7:30 AM -4:00 PM ET<br />\r\n(Except Federal Holidays)<br />\r\n800.272.9540</p>\r\n\r\n<p><strong>Other USDA Inquiries</strong><br />\r\nMonday - Friday,9:00 AM -5:30 PM ET<br />\r\n(Except Federal Holidays)</p>\r\n\r\n<p>833.one.USDA</p>\r\n\r\n<p><a href=\"mailto:askusda@usda.gov\">askusda@usda.gov</a></p>\r\n\r\n<p><a href=\"\">AskUSDA</a></p>\r\n"
