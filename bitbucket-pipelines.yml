image:  node:11
options:
  max-time: 15

clone:
  depth: 20

pipelines:
  branches:
    apache-qa-container:
      - step:
          name: Build and Publish WebMod Apache QA Container
          condition:
            changesets:
              includePaths:
                - ".docker/apache-qa/**"
          script:
            - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
            - docker build -f .docker/apache-qa/Dockerfile -t steampunkfoundry/apache-s3-push:latest ./.docker/apache-qa
            - docker push steampunkfoundry/apache-s3-push:latest
          services:
            - docker
    mariadb-qa-container:
      - step:
          name: Build and Publish WebMod MariaDB QA Container
          condition:
            changesets:
              includePaths:
                - ".docker/mariadb-qa/**"
          script:
            - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
            - docker build -f .docker/mariadb-qa/Dockerfile -t steampunkfoundry/mariadb-s3-push:latest ./.docker/mariadb-qa
            - docker push steampunkfoundry/mariadb-s3-push:latest
          services:
            - docker
    apache-staging-container:
      - step:
          name: Build and Publish WebMod Apache Staging Container
          condition:
            changesets:
              includePaths:
                - ".docker/apache-staging/**"
          script:
            - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
            - docker build -f .docker/apache-staging/Dockerfile -t steampunkfoundry/apache-s3-pull:latest ./.docker/apache-staging
            - docker push steampunkfoundry/apache-s3-pull:latest
          services:
            - docker
    mariadb-staging-container:
      - step:
          name: Build and Publish WebMod MariaDB Staging Container
          condition:
            changesets:
              includePaths:
                - ".docker/mariadb-staging/**"
          script:
            - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
            - docker build -f .docker/mariadb-staging/Dockerfile -t steampunkfoundry/mariadb-s3-pull:latest ./.docker/mariadb-staging
            - docker push steampunkfoundry/mariadb-s3-pull:latest
          services:
            - docker
