services:
  census.path_normalizer:
    class: Drupal\census\Service\CensusPathNormalizer

  census.exporter:
    class: Drupal\census\Service\CensusExporter
    arguments:
      - '@http_client'
      - '@file_system'
      - '@census.path_normalizer'
      - '@logger.factory'
      - '@datetime.time'
