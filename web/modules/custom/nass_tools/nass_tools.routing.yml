# Routes merged from nass_eauth_login.
nass_eauth_login.login:
  path: /signin-oidc
  defaults:
    _controller: '\Drupal\nass_tools\Controller\MiniorangeOauthClientController::miniorange_oauth_client_mo_login'
  requirements:
    _user_is_logged_in: 'FALSE'

nass_eauth_login.admin_settings:
  path: /admin/config/nass-eauth-login/adminsettings
  defaults:
    _form: '\Drupal\nass_tools\Form\NassReleaseSettings'
    _title: 'NASS Release Settings'
  requirements:
    _permission: 'administer site configuration'

# Routes merged from nass_quick_stats.
nass_quick_stats.admin_settings_form:
  path: '/admin/config/nass-quick-stats/adminsettings'
  defaults:
    _form: '\Drupal\nass_tools\Form\QuickStatsSettings'
    _title: 'NASS Quick Stats Settings'
  requirements:
    _permission: 'access administration pages'
  options:  
    _admin_route: TRUE

