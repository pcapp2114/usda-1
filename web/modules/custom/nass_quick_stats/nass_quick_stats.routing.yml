nass_quick_stats.admin_settings_form:
  path: '/admin/config/nass-quick-stats/adminsettings'
  defaults:
    _form: '\Drupal\nass_quick_stats\Form\QuickStatsSettings'
    _title: 'NASS Quick Stats Settings'
  requirements:
    _permission: 'access administration pages'
  options:  
    _admin_route: TRUE
    
nass_quick_stats.ajax_callback:
  path: '/quick-stats'
  defaults:
    _controller: 'Drupal\nass_quick_stats\Controller\Controller::content'
    _title: 'Quick Stats'
  requirements:
    _permission: 'access content'

nass_quick_stats_ajax.ajax_callback:
  path: '/quick-stats-ajax'
  defaults:
    _controller: 'Drupal\nass_quick_stats\Controller\AjaxController::ajaxCallback'
    _title: 'Ajax Callback : Quick Stats'
  requirements:
    _permission: 'access content'
    _format: json