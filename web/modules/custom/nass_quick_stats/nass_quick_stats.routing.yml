nass_quick_stats.admin_settings_form:
  path: '/admin/config/nass-quick-stats/adminsettings'
  defaults:
    _form: '\Drupal\nass_quick_stats\Form\QuickStatsSettings'
    _title: 'NASS Quick Stats Settings'
  requirements:
    _permission: 'access administration pages'
  options:  
    _admin_route: TRUE

nass_quick_stats_sector.ajax_callback:
  path: '/quick-stats-sector'
  defaults:
    _controller: 'Drupal\nass_quick_stats\Controller\AjaxControllerSector::ajaxCallback'
    _title: 'Ajax Callback : Quick Stats : Sector'
  requirements:
    _permission: 'access content'
    _format: json

