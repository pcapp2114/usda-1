nass_eauth_login.login:
  path: /signin-oidc
  defaults:
    _controller: '\Drupal\nass_eauth_login\Controller\miniorange_oauth_clientController::miniorange_oauth_client_mo_login'
  requirements:
    _user_is_logged_in: 'FALSE'

nass_eauth_login.admin_settings:
  path: /admin/config/nass-eauth-login/adminsettings
  defaults:
    _form: '\Drupal\nass_release\Form\NassReleaseSettings'
    _title: 'NASS Release Settings'
  requirements:
    _permission: 'administer site configuration'
