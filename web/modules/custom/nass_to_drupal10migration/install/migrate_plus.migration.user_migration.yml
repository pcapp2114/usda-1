id: user_migration 
label: 'Migrate users from Drupal 9 to Drupal 10'
migration_group: my_migration
my_migration source: 
plugin: d7_user # Use 'd9_user' for Drupal 9 users 
key: drupal9_source
constants: 
  roles: 'authenticated'
track_changes: true 
process:
 uid: uid
  name: name
  pass: pass
  mail: mail
  status: status
  created: created
  changed: changed
  access: access
  timezone: timezone
  init: init
  roles: 
    plugin: migration_lookup
    migration: d7_user_role
    source: roles
    destination: 
      plugin: entity:user
    migration_dependencies: 
      required: 
       - d7_user_role