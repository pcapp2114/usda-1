services:
  # Preserves the existing `drush census_export` / `drush census:export` command.
  census.commands:
    class: Drupal\nass_census\Commands\CensusCommands
    arguments:
      - '@census.exporter'
    tags:
      - { name: drush.command }

  # Preserves the existing `drush agcensus:import` / `drush agci` command.
  agcensus_migrator.commands:
    class: Drupal\nass_census\Commands\AgCensusCommands
    arguments:
      - '@agcensus_migrator.importer'
    tags:
      - { name: drush.command }
