name: NASS Census
type: module
description: Creates and maintains the NASS Census content model, display helpers, Census export tools, and Agriculture Census JSON importer after merging the legacy census and agcensus_migrator modules.
package: NASS
core_version_requirement: ^10 || ^11
version: 1.6.0
dependencies:
  - drupal:node
  - drupal:field
  - drupal:file
  - drupal:text
  - drupal:link
  - drupal:datetime
  - drupal:options
  - drupal:taxonomy
  - drupal:user
  - drupal:media
  - drupal:media_library
  - paragraphs:paragraphs
  - entity_reference_revisions:entity_reference_revisions
  - field_group:field_group
