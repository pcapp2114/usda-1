nass_release.admin_settings_form:
  path: '/admin/config/nass-release/adminsettings'
  defaults:
    _form: '\Drupal\nass_release\Form\NassReleaseSettings'
    _title: 'NASS Release Settings'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

nass_release.content:
  path: '/data-and-statistics/todays-releases'
  defaults:
    _controller: '\Drupal\nass_release\Controller\Controller::content'
    _title: "Today's Releases"
  requirements:
    _permission: 'access content'

nass_release.calendar_page:
  path: '/data-and-statistics/calendar/release-calendar'
  defaults:
    _controller: '\Drupal\nass_release\Controller\Controller::calendar'
    _title: 'Release Calendar'
  requirements:
    _permission: 'access content'

nass_release_todays_data.ajax_callback:
  path: '/nass-release-current-data'
  defaults:
    _controller: '\Drupal\nass_release\Controller\AjaxTodaysController::ajaxCallback'
    _title: 'Current Release Time'
  requirements:
    _permission: 'access content'
    _format: json

nass_release_upcoming_data.ajax_callback:
  path: '/nass-release-upcoming-data'
  defaults:
    _controller: '\Drupal\nass_release\Controller\AjaxUpcomingController::ajaxCallback'
    _title: 'Upcoming Releases Data'
  requirements:
    _permission: 'access content'
    _format: json

nass_release.current_json:
  path: '/nass-release/current'
  defaults:
    _controller: '\Drupal\nass_release\Controller\ReleaseJsonController::current'
  requirements:
    _permission: 'access content'
    _format: json

nass_release.upcoming_json:
  path: '/nass-release/upcoming'
  defaults:
    _controller: '\Drupal\nass_release\Controller\ReleaseJsonController::upcoming'
  requirements:
    _permission: 'access content'
    _format: json

nass_release.calendar_json:
  path: '/nass-release/calendar'
  defaults:
    _controller: '\Drupal\nass_release\Controller\ReleaseJsonController::calendar'
  requirements:
    _permission: 'access content'
    _format: json

nass_release.all_json:
  path: '/nass-release/all'
  defaults:
    _controller: '\Drupal\nass_release\Controller\ReleaseJsonController::all'
  requirements:
    _permission: 'access content'
    _format: json
